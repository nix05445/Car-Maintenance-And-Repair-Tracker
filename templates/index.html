<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Rubrics Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<main-title>🚗 Car Maintenance Tracker</main-title>
<body>
<div class="container">
    <div class="add-service">
        <h2>Add Service Record</h2>
        <form action="/add" method="POST">
        <div class="row">
        <div>
        <label>Date</label>
            <input 
                type="date" 
                name="date">
        </div>
        <nbsp></nbsp>
        <div>
        <label>Mileage</label>
        <input
            type="number"
            name="mileage">
        </div>
        <nbsp></nbsp>
        <div>
        <label>Category</label>
            <select name="category">
            <option value="Maintenance">
                Maintenance
            </option>
            <option value="Repair">
                Repair
            </option>
            </select>
        </div>

        <div>
        <label>Cost</label>
            <input
                type="number"
                step="0.01"
                name="cost">
        </div>
        </div>

        <div>
        <label>Work Performed</label>
            <input
                type="text"
                name="work_done">
        </div>
        
        <button type="submit">
                Save Entry
        </button>
        </form>
    </div>
</div>

<div class="container">
    <div class="history">
        <h2>Service History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mileage</th>
                    <th>Category</th>
                    <th>Work Performed</th>
                    <th>Cost</th>
                </tr>
            </thead>
            <tbody>
                <!--{% for entry in entries %} -->
                <tr>
                <td>{{ entry.date }}</td>
                <td>{{ entry.mileage }}</td>
                <td>{{ entry.category }}</td>
                <td>{{ entry.work_done }}</td>
                <td>${{ "%.2f"|format(entry.cost) }}</td>
                </tr>
                <!--{% endfor %}-->
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
